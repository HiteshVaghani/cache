<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Routeid groups by service</title>
  <desc id="desc">Three Mumbai-Pune-Goa services at 09:00, 10:00, and 11:00. Each service has one routeid shared by Mumbai-Pune, Mumbai-Goa, and Pune-Goa via-routes.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .service { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Arial, sans-serif; fill: #334155; }
      .body { font: 400 16px Arial, sans-serif; fill: #334155; }
      .city { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .cityText { font: 700 17px Arial, sans-serif; fill: #075985; }
      .routeBadge { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .routeText { font: 700 18px Arial, sans-serif; fill: #047857; }
      .chip { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .chipText { font: 600 15px Arial, sans-serif; fill: #334155; }
      .line { stroke: #64748b; stroke-width: 4; stroke-linecap: round; }
      .note { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .noteText { font: 700 16px Arial, sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1100" height="760"/>
  <text x="60" y="60" class="title">Routeid identifies the full service</text>
  <text x="60" y="92" class="subtitle">Each departure gets one unique routeid. All via-routes inside that service carry the same routeid.</text>

  <g transform="translate(60 130)">
    <rect class="card" width="980" height="155" rx="18"/>
    <text x="30" y="42" class="service">Mumbai-Pune-Goa service at 09:00</text>
    <rect x="730" y="24" width="205" height="44" rx="22" class="routeBadge"/>
    <text x="766" y="53" class="routeText">routeid: 1</text>

    <circle cx="100" cy="96" r="28" class="city"/>
    <text x="69" y="102" class="cityText">Mumbai</text>
    <line x1="130" y1="96" x2="300" y2="96" class="line" marker-end="url(#arrow)"/>
    <circle cx="340" cy="96" r="28" class="city"/>
    <text x="316" y="102" class="cityText">Pune</text>
    <line x1="370" y1="96" x2="540" y2="96" class="line" marker-end="url(#arrow)"/>
    <circle cx="580" cy="96" r="28" class="city"/>
    <text x="560" y="102" class="cityText">Goa</text>

    <rect x="680" y="82" width="120" height="34" rx="17" class="chip"/>
    <text x="696" y="104" class="chipText">Mumbai-Pune</text>
    <rect x="812" y="82" width="118" height="34" rx="17" class="chip"/>
    <text x="829" y="104" class="chipText">Mumbai-Goa</text>
    <rect x="738" y="120" width="106" height="34" rx="17" class="chip"/>
    <text x="755" y="142" class="chipText">Pune-Goa</text>
  </g>

  <g transform="translate(60 315)">
    <rect class="card" width="980" height="155" rx="18"/>
    <text x="30" y="42" class="service">Mumbai-Pune-Goa service at 10:00</text>
    <rect x="730" y="24" width="205" height="44" rx="22" class="routeBadge"/>
    <text x="766" y="53" class="routeText">routeid: 2</text>

    <circle cx="100" cy="96" r="28" class="city"/>
    <text x="69" y="102" class="cityText">Mumbai</text>
    <line x1="130" y1="96" x2="300" y2="96" class="line" marker-end="url(#arrow)"/>
    <circle cx="340" cy="96" r="28" class="city"/>
    <text x="316" y="102" class="cityText">Pune</text>
    <line x1="370" y1="96" x2="540" y2="96" class="line" marker-end="url(#arrow)"/>
    <circle cx="580" cy="96" r="28" class="city"/>
    <text x="560" y="102" class="cityText">Goa</text>

    <rect x="680" y="82" width="120" height="34" rx="17" class="chip"/>
    <text x="696" y="104" class="chipText">Mumbai-Pune</text>
    <rect x="812" y="82" width="118" height="34" rx="17" class="chip"/>
    <text x="829" y="104" class="chipText">Mumbai-Goa</text>
    <rect x="738" y="120" width="106" height="34" rx="17" class="chip"/>
    <text x="755" y="142" class="chipText">Pune-Goa</text>
  </g>

  <g transform="translate(60 500)">
    <rect class="card" width="980" height="155" rx="18"/>
    <text x="30" y="42" class="service">Mumbai-Pune-Goa service at 11:00</text>
    <rect x="730" y="24" width="205" height="44" rx="22" class="routeBadge"/>
    <text x="766" y="53" class="routeText">routeid: 3</text>

    <circle cx="100" cy="96" r="28" class="city"/>
    <text x="69" y="102" class="cityText">Mumbai</text>
    <line x1="130" y1="96" x2="300" y2="96" class="line" marker-end="url(#arrow)"/>
    <circle cx="340" cy="96" r="28" class="city"/>
    <text x="316" y="102" class="cityText">Pune</text>
    <line x1="370" y1="96" x2="540" y2="96" class="line" marker-end="url(#arrow)"/>
    <circle cx="580" cy="96" r="28" class="city"/>
    <text x="560" y="102" class="cityText">Goa</text>

    <rect x="680" y="82" width="120" height="34" rx="17" class="chip"/>
    <text x="696" y="104" class="chipText">Mumbai-Pune</text>
    <rect x="812" y="82" width="118" height="34" rx="17" class="chip"/>
    <text x="829" y="104" class="chipText">Mumbai-Goa</text>
    <rect x="738" y="120" width="106" height="34" rx="17" class="chip"/>
    <text x="755" y="142" class="chipText">Pune-Goa</text>
  </g>

  <rect x="60" y="690" width="980" height="46" rx="12" class="note"/>
  <text x="84" y="720" class="noteText">Key point: routeid stays the same across via-routes only within the same service departure.</text>
</svg>
