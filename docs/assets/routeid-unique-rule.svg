<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Routeid uniqueness rule</title>
  <desc id="desc">A good example shows each Mumbai-Pune-Goa departure with its own routeid. A bad example shows two different services reusing routeid 1.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .goodPanel { stroke: #22c55e; }
      .badPanel { stroke: #ef4444; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .panelTitle { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .service { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 16px Arial, sans-serif; fill: #475569; }
      .badge { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .badgeBad { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
      .badgeText { font: 700 17px Arial, sans-serif; fill: #047857; }
      .badgeBadText { font: 700 17px Arial, sans-serif; fill: #b91c1c; }
      .chip { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .chipText { font: 600 14px Arial, sans-serif; fill: #334155; }
      .ok { font: 700 28px Arial, sans-serif; fill: #16a34a; }
      .no { font: 700 28px Arial, sans-serif; fill: #dc2626; }
      .cross { stroke: #dc2626; stroke-width: 8; stroke-linecap: round; }
      .noteGood { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; }
      .noteBad { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; }
      .noteText { font: 700 16px Arial, sans-serif; }
      .goodText { fill: #166534; }
      .badText { fill: #991b1b; }
    </style>
  </defs>

  <rect class="bg" width="1100" height="620"/>
  <text x="60" y="60" class="title">Routeid uniqueness rule</text>
  <text x="60" y="92" class="subtitle">Same service segments share one routeid. Different services must have different routeids.</text>

  <g transform="translate(60 125)">
    <rect class="panel goodPanel" width="470" height="430" rx="18"/>
    <text x="28" y="46" class="ok">OK</text>
    <text x="82" y="45" class="panelTitle">Unique per service</text>

    <g transform="translate(28 80)">
      <text x="0" y="20" class="service">09:00 service</text>
      <rect x="270" y="0" width="140" height="34" rx="17" class="badge"/>
      <text x="298" y="23" class="badgeText">routeid 1</text>
      <rect x="0" y="48" width="122" height="30" rx="15" class="chip"/>
      <text x="13" y="68" class="chipText">Mumbai-Pune</text>
      <rect x="135" y="48" width="120" height="30" rx="15" class="chip"/>
      <text x="150" y="68" class="chipText">Mumbai-Goa</text>
      <rect x="268" y="48" width="108" height="30" rx="15" class="chip"/>
      <text x="283" y="68" class="chipText">Pune-Goa</text>
    </g>

    <g transform="translate(28 190)">
      <text x="0" y="20" class="service">10:00 service</text>
      <rect x="270" y="0" width="140" height="34" rx="17" class="badge"/>
      <text x="298" y="23" class="badgeText">routeid 2</text>
      <rect x="0" y="48" width="122" height="30" rx="15" class="chip"/>
      <text x="13" y="68" class="chipText">Mumbai-Pune</text>
      <rect x="135" y="48" width="120" height="30" rx="15" class="chip"/>
      <text x="150" y="68" class="chipText">Mumbai-Goa</text>
      <rect x="268" y="48" width="108" height="30" rx="15" class="chip"/>
      <text x="283" y="68" class="chipText">Pune-Goa</text>
    </g>

    <g transform="translate(28 300)">
      <text x="0" y="20" class="service">11:00 service</text>
      <rect x="270" y="0" width="140" height="34" rx="17" class="badge"/>
      <text x="298" y="23" class="badgeText">routeid 3</text>
      <rect x="0" y="48" width="122" height="30" rx="15" class="chip"/>
      <text x="13" y="68" class="chipText">Mumbai-Pune</text>
      <rect x="135" y="48" width="120" height="30" rx="15" class="chip"/>
      <text x="150" y="68" class="chipText">Mumbai-Goa</text>
      <rect x="268" y="48" width="108" height="30" rx="15" class="chip"/>
      <text x="283" y="68" class="chipText">Pune-Goa</text>
    </g>
  </g>

  <g transform="translate(570 125)">
    <rect class="panel badPanel" width="470" height="430" rx="18"/>
    <text x="28" y="46" class="no">NO</text>
    <text x="82" y="45" class="panelTitle">Do not reuse routeid</text>

    <g transform="translate(28 95)">
      <text x="0" y="20" class="service">09:00 service</text>
      <rect x="270" y="0" width="140" height="34" rx="17" class="badgeBad"/>
      <text x="298" y="23" class="badgeBadText">routeid 1</text>
      <text x="0" y="58" class="body">Mumbai-Pune, Mumbai-Goa, Pune-Goa</text>
    </g>

    <g transform="translate(28 205)">
      <text x="0" y="20" class="service">10:00 service</text>
      <rect x="270" y="0" width="140" height="34" rx="17" class="badgeBad"/>
      <text x="298" y="23" class="badgeBadText">routeid 1</text>
      <text x="0" y="58" class="body">Different service, same routeid</text>
    </g>

    <line x1="46" y1="74" x2="424" y2="326" class="cross"/>
    <line x1="424" y1="74" x2="46" y2="326" class="cross"/>

    <rect x="28" y="350" width="410" height="50" rx="12" class="noteBad"/>
    <text x="50" y="382" class="noteText badText">Two different services cannot share routeid 1.</text>
  </g>

  <rect x="60" y="570" width="980" height="34" rx="12" class="noteGood"/>
  <text x="84" y="592" class="noteText goodText">Implementation meaning: routeid is the service identifier; via-route rows are children of that service.</text>
</svg>
